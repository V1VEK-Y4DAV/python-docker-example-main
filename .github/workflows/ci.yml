name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # -----------------------
  # 🧪 Build Job
  # -----------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run basic check
        run: |
          python -c "import fastapi"

  # -----------------------
  # 🐳 Containerize Job
  # -----------------------
  containerize:
    runs-on: ubuntu-latest
    needs: build  # runs only if build succeeds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t fastapi-app .

      - name: Run container
        run: |
          docker run -d -p 8000:8000 fastapi-app

      - name: Wait for app
        run: sleep 10

      - name: Test API
        run: curl --fail http://localhost:8000

  # -----------------------
  # 🚀 Build and Push Docker Image Job
  # -----------------------
  build_and_push:
    runs-on: ubuntu-latest
    needs: containerize  # runs only if containerize succeeds
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}   # GitHub secret
          password: ${{ secrets.DOCKERHUB_PASSWORD }}   # GitHub secret

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/python-docker-example-main:latest  # safe tag













